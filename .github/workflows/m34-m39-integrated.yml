name: M34-M39 Integrated Assurance
on:
  pull_request:
    paths:
      - 'packages/security-reliability-integrations/**'
      - 'tests/m34-m39-integrated.test.mjs'
      - 'planning/modules/area-i-security-and-reliability/**'
      - 'planning/modules/area-j-integrations/**'
      - '.engineering/**M3*'
      - '.github/workflows/m34-m39-integrated.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: node --test tests/m34-m39-integrated.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
