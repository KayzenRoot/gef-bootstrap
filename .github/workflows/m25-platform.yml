name: M25 Proof Graph
on:
  pull_request:
    paths:
      - 'packages/proof-graph/**'
      - 'tests/m25-*.mjs'
      - '.engineering/work-orders/GBS-WO-M25-001.md'
      - '.engineering/GBS-WO-M25-ADMISSION.md'
      - 'planning/modules/area-g-evidence-and-review/m25-proof-graph/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m25-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m25-proof-graph.test.mjs tests/m25-hardening.test.mjs tests/m25-snapshot-invalidation.test.mjs tests/m25-source-authority-carry-forward.test.mjs tests/m25-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
