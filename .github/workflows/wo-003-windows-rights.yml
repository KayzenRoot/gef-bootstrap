name: WO-003 Windows Rights Oracle

# Dedicated Windows assurance for the bounded platform dependency admitted by
# `.engineering/decisions/ADR-0004-WINDOWS-EFFECTIVE-RIGHTS-ORACLE.md`.
#
# The high-assurance Git trust policy proves replacement authority on Windows with an OS access check
# for `DELETE` and `FILE_DELETE_CHILD`. That capability only exists on Windows, so a Linux-only
# assurance set cannot verify it; this job exercises it on the platform it belongs to. It does not
# replace or weaken the existing Ubuntu assurance.

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "tests/v11-wo-003-*.test.mjs"
      - "tests/v11-wo-002-*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/wo-003-windows-rights.yml"
  push:
    branches: [release/1.1]
    paths:
      - "packages/cli/**"
      - ".github/workflows/wo-003-windows-rights.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wo-003-windows-rights-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-rights:
    name: Windows rights oracle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --force

      - name: Typecheck
        run: npm run typecheck

      - name: Rights oracle unit fixtures
        run: node --test tests/v11-wo-003-doctor-status.test.mjs

      - name: Diagnostic process E2E
        run: node --test tests/v11-wo-003-doctor-status-e2e.test.mjs

      - name: Packed install smoke
        run: node --test tests/v11-wo-003-dist-smoke.test.mjs

      - name: WO-002 regression suites
        run: |
          node --test tests/v11-wo-002-repository-state.test.mjs
          node --test tests/v11-wo-002-cli.test.mjs
          node --test tests/v11-wo-002-cli-e2e.test.mjs
          node --test tests/v11-wo-002-dist-smoke.test.mjs

      - name: Full validation
        run: npm run validate

      - name: Dependency audit
        run: npm audit --audit-level=high
