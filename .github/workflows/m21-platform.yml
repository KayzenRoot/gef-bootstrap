name: M21 Progress Engine
on:
  pull_request:
    paths:
      - 'packages/progress-engine/**'
      - 'tests/m21-*.mjs'
      - '.engineering/work-orders/GBS-WO-M21-001.md'
      - '.engineering/GBS-WO-M21-ADMISSION.md'
      - 'planning/modules/area-f-progress-and-estimation/m21-progress-engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m21-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m21-progress-engine.test.mjs tests/m21-high-assurance.test.mjs tests/m21-correction-02-high.test.mjs tests/m21-correction-03-high.test.mjs tests/m21-correction-04-high.test.mjs tests/m21-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
