name: m06-platform

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/kernel/src/filesystem-*.ts"
      - "tests/m06-*.test.mjs"
      - ".github/workflows/m06-platform.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "packages/kernel/tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-proof:
    name: filesystem-proof-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Full repository test and validate evidence
        if: matrix.os == 'ubuntu-latest'
        run: npm test && npm run validate
      - name: M06 focused deterministic and real filesystem proof
        run: node --test tests/m06-policy.test.mjs tests/m06-binding.test.mjs tests/m06-effect-adapter.test.mjs tests/m06-managed-intent-matrix.test.mjs tests/m06-effect-certainty.test.mjs tests/m06-race.test.mjs tests/m06-brownfield-startup.test.mjs tests/m06-real-filesystem.test.mjs
