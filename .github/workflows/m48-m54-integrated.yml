name: M48-M54 Integrated Assurance

permissions:
  contents: read
on:
  pull_request:
    paths: ['packages/m48-m54-maintenance/**','tests/m48-m54-maintenance.test.mjs','planning/modules/area-l-artifacts-and-ux/m48-help-system/**','planning/modules/area-m-distribution-and-maintenance/**','planning/modules/area-n-bootstrap-quality/m5[34]-*/**','.engineering/**','.github/workflows/m48-m54-integrated.yml']
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --test tests/m48-m54-maintenance.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
