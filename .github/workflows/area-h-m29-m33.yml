name: Area H M29-M33
on:
  pull_request:
    paths:
      - 'packages/area-h-governance/**'
      - 'tests/area-h-m29-m33.test.mjs'
      - 'planning/modules/area-h-git-and-github/**'
      - '.engineering/evidence/GBS-M29-M33-EVIDENCE.md'
      - '.github/workflows/area-h-m29-m33.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test tests/area-h-m29-m33.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test