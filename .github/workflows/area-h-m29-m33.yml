name: Area H M29-M33
on:
  pull_request:
    paths:
      - 'packages/area-h-governance/**'
      - 'tests/area-h-m29-m33.test.mjs'
      - 'planning/modules/area-h-git-and-github/**'
      - '.engineering/evidence/GBS-M29-M33-EVIDENCE.md'
      - '.github/workflows/area-h-m29-m33.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/area-h-m29-m33.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test