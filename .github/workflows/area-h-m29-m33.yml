name: Area H M29-M33
on:
  pull_request:
    paths:
      - 'packages/area-h-governance/**'
      - 'tests/area-h-m29-m33.test.mjs'
      - 'planning/modules/area-h-git-and-github/**'
      - '.engineering/evidence/GBS-M29-M33-EVIDENCE.md'
      - '.github/workflows/area-h-m29-m33.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test tests/area-h-m29-m33.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test