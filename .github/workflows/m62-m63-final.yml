name: M62-M63 Final Assurance

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'packages/m62-m63-final/**'
      - 'tests/m62-m63-final.test.mjs'
      - 'planning/modules/area-o-documentation-and-closure/m62-v1-final-acceptance/**'
      - 'planning/modules/area-p-engineering-efficiency/m63-executor-performance-engine/**'
      - '.engineering/**'
      - '.github/workflows/m62-m63-final.yml'
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --test tests/m62-m63-final.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
