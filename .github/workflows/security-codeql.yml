name: Security CodeQL

on:
  pull_request:
    branches: [main, "release/1.1"]
    paths:
      - "packages/**/*.ts"
      - "packages/**/*.js"
      - "packages/**/*.mjs"
      - "tests/**/*.mjs"
      - "tools/**/*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-codeql.yml"
  push:
    branches: [main, "release/1.1"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden runner in audit mode
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        continue-on-error: true # StepSecurity is best-effort until free continuity is verified.
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:javascript-typescript"
