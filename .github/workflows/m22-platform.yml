name: M22 Estimation Engine
on:
  pull_request:
    paths:
      - 'packages/estimation-engine/**'
      - 'tests/m22-*.mjs'
      - '.engineering/work-orders/GBS-WO-M22-001.md'
      - '.engineering/GBS-WO-M22-ADMISSION.md'
      - 'planning/modules/area-f-progress-and-estimation/m22-estimation-engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m22-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m22-estimation-engine.test.mjs tests/m22-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
