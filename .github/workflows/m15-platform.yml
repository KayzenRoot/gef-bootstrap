name: M15 Execution Pack Compiler
on:
  pull_request:
    paths:
      - 'packages/execution-pack-compiler/**'
      - 'tests/m15-*.mjs'
      - '.engineering/work-orders/GBS-WO-M15-001.md'
      - '.engineering/GBS-WO-M14-M18-ADMISSION.md'
      - 'planning/modules/area-d-gef-v1/m15-execution-pack-compiler/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m15-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m15-execution-pack-compiler.test.mjs tests/m15-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
