name: M12 Scope and DoD Engine
on:
  pull_request:
    paths:
      - 'packages/scope-dod-engine/**'
      - 'tests/m12-scope-dod-engine.test.mjs'
      - '.engineering/M12-MODULE-GATE.md'
      - '.engineering/work-orders/GBS-WO-M12-001.md'
      - '.engineering/context-locks/GBS-WO-M12-001.json'
      - '.engineering/evidence/GBS-WO-M12-001-EVIDENCE.md'
      - 'planning/modules/area-c-source-pack-and-planning/m12-scope-and-dod-engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m12-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/m12-scope-dod-engine.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
