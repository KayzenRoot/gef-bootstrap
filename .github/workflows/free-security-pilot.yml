# GBS-MAINT-SEC-001 — additive public-repository security checks.
# External Actions are pinned to verified commit SHAs, not moving tags.
name: Free Security Pilot

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    name: Trivy filesystem and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Scan for HIGH/CRITICAL vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  gitleaks:
    name: Gitleaks secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fail closed when Gitleaks PR commit pagination could truncate coverage
        if: github.event_name == 'pull_request'
        env:
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$PR_COMMIT_COUNT" -gt 30 ]; then
            echo '::error::Gitleaks Action v3 reads only the first 30 PR commits. Use a separately governed full-range scan.'
            exit 1
          fi
      - name: Scan without publishing possible secrets as an artifact
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
