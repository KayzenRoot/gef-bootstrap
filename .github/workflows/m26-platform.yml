name: M26 HEDS Delta Review
on:
  pull_request:
    paths:
      - 'packages/heds-delta-review/**'
      - 'tests/m26-*.mjs'
      - '.engineering/work-orders/GBS-WO-M26-001.md'
      - '.engineering/GBS-WO-M26-ADMISSION.md'
      - 'planning/modules/area-g-evidence-and-review/m26-heds-delta-review/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m26-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m26-heds-delta-review.test.mjs tests/m26-hardening.test.mjs tests/m26-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
