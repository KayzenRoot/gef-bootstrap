name: M27 Assurance Pipeline
on:
  pull_request:
    paths:
      - 'packages/assurance-pipeline/**'
      - 'tests/m27-*.mjs'
      - '.engineering/work-orders/GBS-WO-M27-001.md'
      - '.engineering/GBS-WO-M27-ADMISSION.md'
      - 'planning/modules/area-g-evidence-and-review/m27-assurance-pipeline/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m27-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m27-assurance-pipeline.test.mjs tests/m27-hardening.test.mjs tests/m27-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
