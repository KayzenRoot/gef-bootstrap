name: WO-006 Incremental Validation Assurance

on:
  pull_request:
    paths:
      - "packages/test-impact-engine/**"
      - "packages/execution-pack-compiler/**"
      - ".engineering/evidence/GBS-V11-WO-006-EVIDENCE.md"
      - "tests/v11-wo-006-*.test.mjs"
      - "tests/m28-*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/wo-006-incremental-validation.yml"
  push:
    branches: [release/1.1]
    paths:
      - "packages/test-impact-engine/**"
      - "tests/v11-wo-006-*.test.mjs"
      - ".github/workflows/wo-006-incremental-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wo-006-incremental-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incremental-validation:
    name: INC-VAL on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      WO_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact event head on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:WO_EXPECTED_SHA) { throw "Checkout head $actual does not match event head $env:WO_EXPECTED_SHA" }

      - name: Assert exact event head on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$WO_EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build -- --force

      - name: Typecheck
        run: npm run typecheck

      - name: INC-VAL and M28 regression
        run: node --test tests/v11-wo-006-incremental-validation.test.mjs tests/m28-test-impact-engine.test.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high
