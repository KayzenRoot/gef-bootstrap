name: M17 Checkpoint Engine
on:
  pull_request:
    paths:
      - 'packages/checkpoint-engine/**'
      - 'tests/m17-*.mjs'
      - '.engineering/work-orders/GBS-WO-M17-001.md'
      - 'planning/modules/area-e-continuity/m17-checkpoint-engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m17-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m17-checkpoint-engine.test.mjs tests/m17-hardening.test.mjs tests/m17-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
