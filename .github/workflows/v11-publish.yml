          test "$(npm --version)" = "11.5.1"

      - name: Fail closed if the immutable version already exists; otherwise publish with provenance
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/gef-v1.1.1-package-receipt/GBS-V11-WO-011-RELEASE-MANIFEST.json"
          tarball="$RUNNER_TEMP/gef-v1.1.1-package-receipt/gef-bootstrap-cli-1.1.1.tgz"
          test -s "$receipt"
          test -s "$tarball"
          node --input-type=module - "$receipt" "$tarball" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const [receiptPath, tarballPath] = process.argv.slice(2);
          const receipt = JSON.parse(readFileSync(receiptPath, 'utf8'));
          const actual = createHash('sha256').update(readFileSync(tarballPath)).digest('hex');
          const commit = execFileSync('git', ['rev-parse', 'v1.1.1^{commit}'], { encoding: 'utf8' }).trim();
          if (receipt.workOrder !== 'GBS-V11-WO-011' || receipt.event !== 'push' || receipt.ref !== 'refs/tags/v1.1.1' || receipt.tag !== 'v1.1.1' || receipt.sourceCommit !== commit || receipt.sourceCommit !== process.env.GITHUB_SHA || receipt.packageName !== '@gef-bootstrap/cli' || receipt.version !== '1.1.1' || receipt.private !== false || receipt.repository !== 'https://github.com/KayzenRoot/gef-bootstrap.git' || receipt.tarball.sha256 !== actual) throw new Error('Refusing publication: receipt is not bound to the exact v1.1.1 tag and tarball');
          NODE
          registry="https://registry.npmjs.org/"
          error_file="$RUNNER_TEMP/npm-v1.1.1-preflight-error.txt"
          if npm view @gef-bootstrap/cli@1.1.1 version --registry="$registry" >/dev/null 2>"$error_file"; then
