name: V1.1 trusted npm publication

on:
  push:
    tags: ["v1.1.0", "v1.1.1"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run candidate verification or read-only release recovery"
        required: true
        type: choice
        options:
          - CANDIDATE
          - RECOVERY
        default: CANDIDATE

permissions:
  contents: read

concurrency:
  group: v11-npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/tags/v1.1.0' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && inputs.mode != 'RECOVERY')
    name: Verify and pack the accepted v1.1.0 source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the pushed v1.1.0 tag to point into main
        if: github.event_name == 'push' && github.ref == 'refs/tags/v1.1.0'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v1.1.0"
          release_commit="$(git rev-parse 'v1.1.0^{commit}')"
          test "$(git rev-parse HEAD)" = "$release_commit"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          echo "Verified release source commit: $release_commit"

      - name: Require manual branch dispatch to test this exact candidate
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified manual candidate branch $GITHUB_REF_NAME at $GITHUB_SHA"

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin the minimum npm CLI with trusted publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Validate release identity and public package metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          const releasePush = process.env.GITHUB_EVENT_NAME === 'push' && process.env.GITHUB_REF === 'refs/tags/v1.1.0';
          if (manifest.name !== '@gef-bootstrap/cli' || manifest.version !== '1.1.0' || (releasePush && manifest.private !== false)) {
            throw new Error('Refusing candidate: package identity mismatch, or release package is not public');
          }
          NODE

      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build, validate and audit the exact tagged source
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run validate
          npm audit --audit-level=high

      - name: Build and inspect the actual release tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/gef-v1.1.0-package"
          mkdir -p "$destination"
          tarball="$(node packages/cli/scripts/prepare-package.mjs --pack --destination "$destination")"
          test -s "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          contents="$RUNNER_TEMP/gef-v1.1.0-package-contents.txt"
          tar -tzf "$tarball" > "$contents"
          node --input-type=module - "$tarball" "$contents" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const [archive, contentsPath] = process.argv.slice(2);
          const pkg = JSON.parse(execFileSync('tar', ['-xOzf', archive, 'package/package.json'], { encoding: 'utf8' }));
          const expectedFiles = ['LICENSE', 'README.md', 'bin', 'dist', 'schemas', 'vendor'];
          const expectedBundles = ['@gef-bootstrap/config', '@gef-bootstrap/contracts', '@gef-bootstrap/kernel', '@gef-bootstrap/preflight', '@gef-bootstrap/project-identity', '@koromix/koffi-darwin-arm64', '@koromix/koffi-darwin-x64', '@koromix/koffi-linux-x64', '@koromix/koffi-win32-x64', 'koffi'];
          const expectedNativeBundles = ['@koromix/koffi-linux-x64', '@koromix/koffi-darwin-x64', '@koromix/koffi-darwin-arm64', '@koromix/koffi-win32-x64'];
          const sorted = (items) => [...items].sort();
          if (JSON.stringify(sorted(pkg.files ?? [])) !== JSON.stringify(sorted(expectedFiles))) {
            throw new Error('Refusing package: files allowlist differs from the reviewed WO-010 set');
          }
          if (JSON.stringify(sorted(pkg.bundleDependencies ?? pkg.bundledDependencies ?? [])) !== JSON.stringify(sorted(expectedBundles))) {
            throw new Error('Refusing package: bundled dependencies differ from the reviewed WO-010 set');
          }
          const files = new Set(['package/package.json', 'package/LICENSE', 'package/README.md']);
          const contentRoots = expectedFiles.filter((name) => ['bin', 'dist', 'schemas', 'vendor'].includes(name)).map((name) => `package/${name}`);
          const bundleRoots = expectedBundles.map((name) => `package/node_modules/${name}`);
          const entries = readFileSync(contentsPath, 'utf8').split(/\r?\n/).filter(Boolean);
          for (const name of expectedNativeBundles) {
            const packageRoot = 'package/node_modules/' + name + '/';
            if (pkg.optionalDependencies?.[name] !== '3.3.0' ||
              !entries.some((entry) => entry.startsWith(packageRoot) && entry.endsWith('/koffi.node'))) {
              throw new Error('Refusing package: lockfile-pinned Koffi prebuild is missing: ' + name);
            }
          }
          const sensitiveFilename = /(^|\/)(?:\.npmrc|\.env(?:\.[^/]*)?|credentials?(?:\.[^/]*)?|secrets?(?:\.[^/]*)?|tokens?(?:\.[^/]*)?|id_rsa(?:\.[^/]*)?|[^/]*\.(?:pem|key|p12|pfx))$/i;
          for (const entry of entries) {
            const normalized = entry.replace(/\/+$/, '');
            const directory = entry.endsWith('/');
            const contentAllowed = contentRoots.some((root) => normalized === root || normalized.startsWith(`${root}/`));
            const bundleAllowed = bundleRoots.some((root) => normalized === root || normalized.startsWith(`${root}/`));
            const parentDirectoryAllowed = directory && (normalized === 'package' || normalized === 'package/node_modules' || [...contentRoots, ...bundleRoots].some((root) => root.startsWith(`${normalized}/`)));
            if (!entry.startsWith('package/') || !(files.has(normalized) || contentAllowed || bundleAllowed || parentDirectoryAllowed)) {
              throw new Error(`Refusing package: archive path is outside the reviewed allowlist: ${entry}`);
            }
            if (sensitiveFilename.test(normalized)) throw new Error(`Refusing package: sensitive filename is present: ${entry}`);
          }
          for (const required of ['package/package.json', 'package/LICENSE', 'package/README.md', 'package/bin/gef.mjs', 'package/dist/main.js', 'package/vendor/MANIFEST.json', 'package/schemas/gef-cli-state.schema.json']) {
            if (!entries.includes(required)) throw new Error(`Refusing package: required path is missing: ${required}`);
          }
          NODE

          mkdir -p "$RUNNER_TEMP/gef-v1.1.0-package-receipt"
          cp "$tarball" "$RUNNER_TEMP/gef-v1.1.0-package-receipt/"
          archive="$RUNNER_TEMP/gef-v1.1.0-package-receipt/$(basename "$tarball")"
          package_json="$RUNNER_TEMP/gef-v1.1.0-package.json"
          tar -xOzf "$archive" package/package.json > "$package_json"
          node --input-type=module - "$archive" "$package_json" "$RUNNER_TEMP/gef-v1.1.0-package-receipt/GBS-V11-WO-010-RELEASE-MANIFEST.json" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const [archive, packageJsonPath, receiptPath] = process.argv.slice(2);
          const pkg = JSON.parse(readFileSync(packageJsonPath, 'utf8'));
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const receipt = {
            schemaVersion: 1,
            kind: 'gef.v11.release-package-candidate',
            version: pkg.version,
            packageName: pkg.name,
            sourceCommit,
            event: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            tag: process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME : null,
            runnerPlatform: process.platform,
            runnerArchitecture: process.arch,
            node: process.version,
            npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
            license: pkg.license,
            private: pkg.private,
            tarball: {
              file: archive.split(/[\\/]/).at(-1),
              sha256: createHash('sha256').update(readFileSync(archive)).digest('hex'),
              inspection: 'COMPLETE_PACKAGE_PATH_ALLOWLIST_AND_SENSITIVE_FILENAME_CHECKS_PASSED'
            },
            provenance: {
              method: 'npm trusted publishing via GitHub OIDC',
              expectedWorkflow: 'v11-publish.yml',
              issued: false,
              note: 'A registry attestation exists only after the publish job succeeds.'
            }
          };
          writeFileSync(receiptPath, JSON.stringify(receipt, null, 2) + '\n');
          console.log('Tarball SHA-256: ' + receipt.tarball.sha256);
          console.log('Source commit: ' + sourceCommit);
          NODE

      - name: Install and smoke-test the exact packed artifact
        shell: bash
        env:
          GEF_RELEASE_TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/gef-v1.1.0-consumer"
          mkdir -p "$consumer"
          (
            cd "$consumer"
            npm init -y
            npm install --package-lock-only --ignore-scripts --offline --no-audit --no-fund "$GEF_RELEASE_TARBALL"
            test -s package-lock.json
            npm ci --ignore-scripts --offline --no-audit --no-fund
          )
          bin="$consumer/node_modules/@gef-bootstrap/cli/bin/gef.mjs"
          node "$bin" --help > "$RUNNER_TEMP/gef-help.json"
          node "$bin" --version > "$RUNNER_TEMP/gef-version.json"
          node "$bin" doctor --target "$consumer" --json > "$RUNNER_TEMP/gef-doctor.json"
          node "$bin" status --target "$consumer" --json > "$RUNNER_TEMP/gef-status.json"
          cd "$consumer"
          node --input-type=module -e "import { processExitCodeFor } from '@gef-bootstrap/cli'; if (typeof processExitCodeFor !== 'function') process.exit(1)"

      - name: Retain the package and exact-input checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gef-v1.1.0-package-${{ github.run_id }}
          path: ${{ runner.temp }}/gef-v1.1.0-package-receipt/
          if-no-files-found: error
          retention-days: 30

  recovery:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'RECOVERY'
    name: Verify the published v1.1.0 without republishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.1.0
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact published source commit
        shell: bash
        env:
          EXPECTED_RELEASE_COMMIT: fb2a2e6d41086e82ba03f307dc6ada18a52458ea
          RECOVERY_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RECOVERY_MODE" = "RECOVERY"
          source_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse 'v1.1.0^{commit}')"
          test "$source_commit" = "$EXPECTED_RELEASE_COMMIT"
          test "$tag_commit" = "$EXPECTED_RELEASE_COMMIT"
          echo "Verified immutable release source: $source_commit"
          echo "Recovery dispatch source: $GITHUB_SHA"

      - name: Set up the recovery runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
          package-manager-cache: false

      - name: Pin npm signature verification support
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Install the immutable tag dependencies
        run: npm ci --ignore-scripts

      - name: Re-run the failed release validations
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run validate
          npm audit --audit-level=high

      - name: Rebuild the tag tarball and compare the published registry package
        shell: bash
        env:
          EXPECTED_RELEASE_COMMIT: fb2a2e6d41086e82ba03f307dc6ada18a52458ea
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/gef-v1.1.0-recovery-package"
          mkdir -p "$destination"
          tarball="$(node packages/cli/scripts/prepare-package.mjs --pack --destination "$destination")"
          test -s "$tarball"
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$EXPECTED_RELEASE_COMMIT"
          tarball_name="$(basename "$tarball")"
          tarball_integrity="$(
            node --input-type=module - "$tarball" <<'SRI'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[2])).digest("base64")}`);
          SRI
          )"
          tarball_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          package_json="$RUNNER_TEMP/gef-v1.1.0-recovery-package.json"
          tar -xOzf "$tarball" package/package.json > "$package_json"
          package_name="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).name)" "$package_json")"
          package_version="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).version)" "$package_json")"
          test "$package_name" = "@gef-bootstrap/cli"
          test "$package_version" = "1.1.0"
          published_version="$(npm view @gef-bootstrap/cli@1.1.0 version --registry=https://registry.npmjs.org/)"
          published_integrity="$(npm view @gef-bootstrap/cli@1.1.0 dist.integrity --registry=https://registry.npmjs.org/)"
          published_repository="$(npm view @gef-bootstrap/cli@1.1.0 repository.url --registry=https://registry.npmjs.org/)"
          if [ "$published_version" != "1.1.0" ]; then
            echo "Refusing recovery: npm registry returned version '$published_version'" >&2
            exit 1
          fi
          expected_repository="git+https://github.com/KayzenRoot/gef-bootstrap.git"
          if [ "$published_repository" != "$expected_repository" ]; then
            echo "Refusing recovery: npm registry returned unexpected repository.url '$published_repository'" >&2
            exit 1
          fi
          if [ "$published_integrity" != "$tarball_integrity" ]; then
            echo "GBS_V11_WO_010_RELEASE_INCIDENT_PACKAGE_MISMATCH" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            echo "Published dist.integrity=$published_integrity; rebuilt tag tarball integrity=$tarball_integrity" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          {
            echo "### Immutable release package receipt"
            echo "- Package: $package_name@$package_version"
            echo "- Rebuilt archive: $tarball_name"
            echo "- Source SHA: $source_commit"
            echo "- Rebuilt tarball SHA-512 SRI: $tarball_integrity"
            echo "- Published npm dist.integrity: $published_integrity"
            echo "- Rebuilt tarball SHA-256: $tarball_sha256"
            echo "- Registry repository.url: $published_repository"
            echo "- Result: published package matches the rebuilt immutable-tag tarball"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verified $package_name@$package_version from $source_commit; integrity=$tarball_integrity sha256=$tarball_sha256"

      - name: Install, inspect and smoke-test the actual registry package
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d "$RUNNER_TEMP/gef-v1.1.0-registry-smoke.XXXXXX")"
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          npm init -y
          npm install @gef-bootstrap/cli@1.1.0 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/

          cli_root="$consumer/node_modules/@gef-bootstrap/cli"
          node --input-type=module - "$cli_root" <<'BUNDLES'
          import { existsSync, lstatSync, readdirSync, readFileSync } from "node:fs";
          import { join, resolve } from "node:path";

          const cliRoot = resolve(process.argv[2]);
          const bundleRoot = join(cliRoot, "node_modules", "@gef-bootstrap");
          const requiredPackages = ["contracts", "kernel", "preflight", "config", "project-identity"];
          const isRealDirectory = (path) => {
            try {
              const stat = lstatSync(path);
              return stat.isDirectory() && !stat.isSymbolicLink();
            } catch {
              return false;
            }
          };
          const containsRealFile = (directory) => {
            try {
              return readdirSync(directory, { withFileTypes: true }).some((entry) => {
                const path = join(directory, entry.name);
                if (entry.isFile()) return !entry.isSymbolicLink();
                return entry.isDirectory() && !entry.isSymbolicLink() && containsRealFile(path);
              });
            } catch {
              return false;
            }
          };

          let observed = [];
          if (isRealDirectory(bundleRoot)) {
            observed = readdirSync(bundleRoot, { withFileTypes: true })
              .filter((entry) => entry.isDirectory() && !entry.isSymbolicLink())
              .map((entry) => entry.name)
              .sort();
          }
          console.log(`Inspected installed CLI package: ${cliRoot}`);
          console.log(`Inspected bundled runtime directory: ${bundleRoot}`);
          console.log(`Observed installed scoped package directories: ${observed.join(", ") || "<none>"}`);

          const missing = [];
          for (const name of requiredPackages) {
            const packageRoot = join(bundleRoot, name);
            const manifestPath = join(packageRoot, "package.json");
            const distPath = join(packageRoot, "dist");
            try {
              if (!isRealDirectory(packageRoot) || !existsSync(manifestPath) || lstatSync(manifestPath).isSymbolicLink()) {
                missing.push(`@gef-bootstrap/${name}`);
                continue;
              }
              const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
              if (manifest.name !== `@gef-bootstrap/${name}` || !isRealDirectory(distPath) || !containsRealFile(distPath)) {
                missing.push(`@gef-bootstrap/${name}`);
              }
            } catch {
              missing.push(`@gef-bootstrap/${name}`);
            }
          }
          if (missing.length > 0) {
            console.error(`GBS_V11_WO_010_RELEASE_INCIDENT_BUNDLED_RUNTIME_MISSING: ${missing.join(", ")}`);
            process.exit(1);
          }
          console.log(`PASS: all required bundled runtimes are physically present with built dist files: ${requiredPackages.map((name) => `@gef-bootstrap/${name}`).join(", ")}`);
          BUNDLES

          smoke_failed() {
            local status=$?
            trap - ERR
            echo "GBS_V11_WO_010_RELEASE_INCIDENT_RUNTIME_SMOKE_FAILED" | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit "$status"
          }
          trap smoke_failed ERR
          bin="$consumer/node_modules/@gef-bootstrap/cli/bin/gef.mjs"
          test -s "$bin"
          export PATH="$consumer/node_modules/.bin:$PATH"
          gef --version
          gef --help
          node --input-type=module -e "import { processExitCodeFor } from '@gef-bootstrap/cli'; if (typeof processExitCodeFor !== 'function') process.exit(1)"
          status_json="$RUNNER_TEMP/gef-v1.1.0-recovery-status.json"
          gef status --target "$consumer" --json > "$status_json"
          node --input-type=module - "$RUNNER_TEMP/gef-v1.1.0-recovery-status.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          JSON.parse(readFileSync(process.argv[2], 'utf8'));
          NODE
          trap - ERR
          signatures="$(npm view @gef-bootstrap/cli@1.1.0 dist.signatures --json --registry=https://registry.npmjs.org/)"
          attestations="$(npm view @gef-bootstrap/cli@1.1.0 dist.attestations --json --registry=https://registry.npmjs.org/)"
          metadata_state() {
            node --input-type=module - "$1" <<'METADATA'
          const raw = process.argv[2].trim();
          if (raw === "" || raw === "null") {
            process.stdout.write("ABSENT");
          } else {
            try {
              const value = JSON.parse(raw);
              const present = Array.isArray(value) ? value.length > 0 :
                value !== null && typeof value === "object" ? Object.keys(value).length > 0 : Boolean(value);
              process.stdout.write(present ? "PRESENT" : "ABSENT");
            } catch {
              process.stdout.write("PRESENT_UNPARSED");
            }
          }
          METADATA
          }
          signatures_state="$(metadata_state "$signatures")"
          attestations_state="$(metadata_state "$attestations")"
          {
            echo "### Read-only npm signature and provenance metadata"
            echo "- dist.signatures: $signatures_state"
            echo "- dist.attestations: $attestations_state"
            if [ "$attestations_state" = "ABSENT" ]; then
              echo "- PROVENANCE_NOT_CLAIMED_FOR_BOOTSTRAP_1_1_0"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: registry install, bundled runtime inspection, CLI/library/status smoke completed without publication."

  cross-platform-artifact-smoke:
    needs: verify
    name: Install and use the exact candidate tarball (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the exact source for the acceptance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the exact package and checksum receipt from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gef-v1.1.0-package-${{ github.run_id }}
          path: ${{ runner.temp }}/gef-v1.1.0-package-receipt

      - name: Set up the runtime used for package acceptance
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
          package-manager-cache: false

      - name: Bind the tarball checksum and receipt to this exact workflow source
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          EXPECTED_EVENT: ${{ github.event_name }}
          EXPECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = join(process.env.RUNNER_TEMP, 'gef-v1.1.0-package-receipt');
          const receipt = JSON.parse(readFileSync(join(directory, 'GBS-V11-WO-010-RELEASE-MANIFEST.json'), 'utf8'));
          const archive = readFileSync(join(directory, receipt.tarball.file));
          const actual = createHash('sha256').update(archive).digest('hex');
          if (receipt.sourceCommit !== process.env.EXPECTED_SOURCE_COMMIT || receipt.event !== process.env.EXPECTED_EVENT || receipt.ref !== process.env.EXPECTED_REF || receipt.tarball.sha256 !== actual || receipt.version !== '1.1.0' || receipt.packageName !== '@gef-bootstrap/cli') {
            throw new Error('Refusing cross-platform smoke: receipt, source, version or tarball checksum mismatch');
          }
          console.log(`Verified ${receipt.tarball.file} from ${receipt.sourceCommit}; sha256=${actual}`);
          NODE

      - name: Install, use, migrate with and remove the same tarball on this platform
        shell: bash
        env:
          GEF_RELEASE_RECEIPT_DIR: ${{ runner.temp }}/gef-v1.1.0-package-receipt
          GEF_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          GEF_EXPECTED_EVENT: ${{ github.event_name }}
          GEF_EXPECTED_REF: ${{ github.ref }}
        run: node tests/v11-wo-010-artifact-smoke.mjs

  publish:
    needs: [verify, cross-platform-artifact-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.1.0'
    name: Publish through npm OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release tag for receipt verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified package from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "gef-v1.1.0-package-$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/gef-v1.1.0-package-receipt"

      - name: Set up npm trusted publisher client
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin the minimum npm CLI with trusted publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Verify receipt and publish the exact tarball with provenance
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/gef-v1.1.0-package-receipt/GBS-V11-WO-010-RELEASE-MANIFEST.json"
          tarball="$RUNNER_TEMP/gef-v1.1.0-package-receipt/gef-bootstrap-cli-1.1.0.tgz"
          test -s "$receipt"
          test -s "$tarball"
          node --input-type=module - "$receipt" "$tarball" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const [receiptPath, tarballPath] = process.argv.slice(2);
          const receipt = JSON.parse(readFileSync(receiptPath, 'utf8'));
          const actual = createHash('sha256').update(readFileSync(tarballPath)).digest('hex');
          const releaseCommit = execFileSync('git', ['rev-parse', 'v1.1.0^{commit}'], { encoding: 'utf8' }).trim();
          if (receipt.kind !== 'gef.v11.release-package-candidate' || receipt.event !== 'push' || receipt.ref !== 'refs/tags/v1.1.0' || receipt.sourceCommit !== releaseCommit || receipt.sourceCommit !== process.env.GITHUB_SHA || receipt.tag !== 'v1.1.0' || receipt.tarball.sha256 !== actual || receipt.version !== '1.1.0' || receipt.packageName !== '@gef-bootstrap/cli' || receipt.private !== false) {
            throw new Error('Refusing publication: package receipt does not match the exact tag, version, visibility or tarball');
          }
          NODE

          registry="https://registry.npmjs.org/"
          version_output="$RUNNER_TEMP/npm-existing-version.txt"
          version_error="$RUNNER_TEMP/npm-existing-version-error.txt"
          if npm view @gef-bootstrap/cli@1.1.0 version --registry="$registry" >"$version_output" 2>"$version_error"; then
            existing_version="$(tr -d '[:space:]' < "$version_output")"
            if [ "$existing_version" != "1.1.0" ]; then
              echo "Refusing publication: registry returned unexpected version '$existing_version' for @gef-bootstrap/cli@1.1.0" >&2
              exit 1
            fi

            shasum_output="$RUNNER_TEMP/npm-existing-shasum.txt"
            shasum_error="$RUNNER_TEMP/npm-existing-shasum-error.txt"
            if ! npm view @gef-bootstrap/cli@1.1.0 dist.shasum --registry="$registry" >"$shasum_output" 2>"$shasum_error"; then
              cat "$shasum_error" >&2
              exit 1
            fi
            published_shasum="$(tr -d '[:space:]' < "$shasum_output")"
            tarball_sha1="$(node --input-type=module - "$tarball" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          console.log(createHash('sha1').update(readFileSync(process.argv[2])).digest('hex'));
          NODE
          )"
            if [ "$published_shasum" != "$tarball_sha1" ]; then
              echo "Refusing publication: registry dist.shasum does not match the exact workflow tarball" >&2
              exit 1
            fi

            echo "outcome=bootstrap-version-already-present" >> "$GITHUB_OUTPUT"
            echo "@gef-bootstrap/cli@1.1.0 already exists with the exact workflow tarball SHA-1; publication was skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            if ! grep -Fq 'E404' "$version_error"; then
              cat "$version_error" >&2
              exit 1
            fi
            echo "outcome=published" >> "$GITHUB_OUTPUT"
            echo "@gef-bootstrap/cli@1.1.0 was absent; continuing with the tag-only npm OIDC publication." >> "$GITHUB_STEP_SUMMARY"
            npm publish "$tarball" --access public --provenance --ignore-scripts
          fi

  post-publish:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.1.0'
    name: Verify public retrieval and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm signature verification support
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.5.1

      - name: Retrieve, verify signatures and smoke-test the published package
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view @gef-bootstrap/cli@1.1.0 version)" = "1.1.0"
          npm audit signatures @gef-bootstrap/cli@1.1.0
          consumer="$RUNNER_TEMP/gef-v1.1.0-published-consumer"
          mkdir -p "$consumer"
          (
            cd "$consumer"
            npm init -y
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund @gef-bootstrap/cli@1.1.0
            test -s package-lock.json
            npm ci --ignore-scripts --no-audit --no-fund
          )
          bin="$consumer/node_modules/@gef-bootstrap/cli/bin/gef.mjs"
          node "$bin" --help > /dev/null
          node "$bin" --version | grep -F '"version": "1.1.0"'

  verify-1-1-1:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.1.1'
    name: Verify and pack exact v1.1.1 release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the exact v1.1.1 tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact tag to point into main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v1.1.1"
          release_commit="$(git rev-parse 'v1.1.1^{commit}')"
          test "$(git rev-parse HEAD)" = "$release_commit"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main

      - name: Set up Node.js and pin the trusted-publishing npm client
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm trusted-publishing support
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Validate, build, audit and create one exact release tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          if (manifest.name !== '@gef-bootstrap/cli' || manifest.version !== '1.1.1' || manifest.private !== false || manifest.repository?.url !== 'https://github.com/KayzenRoot/gef-bootstrap.git' || manifest.publishConfig?.access !== 'public') {
            throw new Error('Refusing release: package name, version, visibility, repository or public access differs from the admitted identity');
          }
          NODE
          npm ci --ignore-scripts
          npm run build
          npm run validate
          npm audit --audit-level=high
          destination="$RUNNER_TEMP/gef-v1.1.1-package-receipt"
          mkdir -p "$destination"
          tarball="$(node packages/cli/scripts/prepare-package.mjs --pack --destination "$destination")"
          test -s "$tarball"
          tar -tzf "$tarball" > "$RUNNER_TEMP/gef-v1.1.1-package-files.txt"
          node --input-type=module - "$tarball" "$RUNNER_TEMP/gef-v1.1.1-package-files.txt" "$destination/GBS-V11-WO-011-RELEASE-MANIFEST.json" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const [archive, filesPath, receiptPath] = process.argv.slice(2);
          const pkg = JSON.parse(execFileSync('tar', ['-xOzf', archive, 'package/package.json'], { encoding: 'utf8' }));
          const expectedFiles = ['LICENSE', 'README.md', 'bin', 'dist', 'schemas', 'vendor'];
          const expectedBundles = ['@gef-bootstrap/config', '@gef-bootstrap/contracts', '@gef-bootstrap/kernel', '@gef-bootstrap/preflight', '@gef-bootstrap/project-identity', '@koromix/koffi-darwin-arm64', '@koromix/koffi-darwin-x64', '@koromix/koffi-linux-x64', '@koromix/koffi-win32-x64', 'koffi'];
          const sort = (items) => [...items].sort();
          if (pkg.name !== '@gef-bootstrap/cli' || pkg.version !== '1.1.1' || pkg.private !== false || pkg.repository?.url !== 'https://github.com/KayzenRoot/gef-bootstrap.git') throw new Error('Refusing release tarball: package identity mismatch');
          if (JSON.stringify(sort(pkg.files ?? [])) !== JSON.stringify(sort(expectedFiles)) || JSON.stringify(sort(pkg.bundleDependencies ?? pkg.bundledDependencies ?? [])) !== JSON.stringify(sort(expectedBundles))) throw new Error('Refusing release tarball: package allowlist or bundled runtime set changed');
          const entries = readFileSync(filesPath, 'utf8').split(/\r?\n/).filter(Boolean);
          const contentRoots = expectedFiles.filter((name) => ['bin', 'dist', 'schemas', 'vendor'].includes(name)).map((name) => `package/${name}`);
          const bundleRoots = expectedBundles.map((name) => `package/node_modules/${name}`);
          const sensitive = /(^|\/)(?:\.npmrc|\.env(?:\.[^/]*)?|credentials?(?:\.[^/]*)?|secrets?(?:\.[^/]*)?|tokens?(?:\.[^/]*)?|id_rsa(?:\.[^/]*)?|[^/]*\.(?:pem|key|p12|pfx))$/i;
          for (const entry of entries) {
            const name = entry.replace(/\/+$/, '');
            const directory = entry.endsWith('/');
            const allowed = name === 'package/package.json' || name === 'package/LICENSE' || name === 'package/README.md' || contentRoots.some((root) => name === root || name.startsWith(`${root}/`)) || bundleRoots.some((root) => name === root || name.startsWith(`${root}/`)) || (directory && (name === 'package' || name === 'package/node_modules' || [...contentRoots, ...bundleRoots].some((root) => root.startsWith(`${name}/`))));
            if (!entry.startsWith('package/') || !allowed || sensitive.test(name)) throw new Error(`Refusing release tarball entry: ${entry}`);
          }
          for (const required of ['package/package.json', 'package/LICENSE', 'package/README.md', 'package/bin/gef.mjs', 'package/dist/main.js', 'package/vendor/MANIFEST.json', 'package/schemas/gef-cli-state.schema.json']) if (!entries.includes(required)) throw new Error(`Release tarball is missing ${required}`);
          const sourceCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const receipt = {
            schemaVersion: 1,
            kind: 'gef.v11.release-package-candidate',
            workOrder: 'GBS-V11-WO-011',
            packageName: pkg.name,
            version: pkg.version,
            private: pkg.private,
            repository: pkg.repository.url,
            sourceCommit,
            event: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            tag: process.env.GITHUB_REF_NAME,
            tarball: { file: archive.split(/[\\/]/).at(-1), sha256: createHash('sha256').update(readFileSync(archive)).digest('hex') }
          };
          writeFileSync(receiptPath, JSON.stringify(receipt, null, 2) + '\n');
          console.log(`Exact v1.1.1 source: ${sourceCommit}`);
          console.log(`Exact tarball SHA-256: ${receipt.tarball.sha256}`);
          NODE

      - name: Upload exact release tarball and receipt for platform smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gef-v1.1.1-release-package-${{ github.run_id }}
          path: ${{ runner.temp }}/gef-v1.1.1-package-receipt/
          if-no-files-found: error
          retention-days: 30

  cross-platform-artifact-smoke-1-1-1:
    needs: verify-1-1-1
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.1.1'
    name: Same v1.1.1 artifact / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the exact release commit for the smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download this run's exact v1.1.1 tarball and receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gef-v1.1.1-release-package-${{ github.run_id }}
          path: ${{ runner.temp }}/gef-v1.1.1-package-receipt

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install, use and migrate with the same v1.1.1 tarball on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GEF_RELEASE_RECEIPT_DIR: ${{ runner.temp }}/gef-v1.1.1-package-receipt
          GEF_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          GEF_EXPECTED_EVENT: ${{ github.event_name }}
          GEF_EXPECTED_REF: ${{ github.ref }}
          GEF_EXPECTED_PRODUCT_VERSION: "1.1.1"
        run: node tests/v11-wo-010-artifact-smoke.mjs

      - name: Install, use and migrate with the same v1.1.1 tarball as unprivileged Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GEF_RELEASE_RECEIPT_DIR: ${{ runner.temp }}/gef-v1.1.1-package-receipt
          GEF_EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
          GEF_EXPECTED_EVENT: ${{ github.event_name }}
          GEF_EXPECTED_REF: ${{ github.ref }}
          GEF_EXPECTED_PRODUCT_VERSION: "1.1.1"
        run: ./.github/scripts/run-v11-unprivileged-validation.ps1 -ReleaseArtifactSmoke

  publish-1-1-1:
    needs: [verify-1-1-1, cross-platform-artifact-smoke-1-1-1]
    if: github.event_name == 'push' && github.ref == 'refs/tags/v1.1.1'
    name: Publish v1.1.1 through npm OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release tag for receipt verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact tarball produced and tested by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "gef-v1.1.1-release-package-$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/gef-v1.1.1-package-receipt"

      - name: Set up npm trusted publisher client
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
