name: M16 Policy & Guardrail Engine
on:
  pull_request:
    paths:
      - 'packages/policy-guardrail-engine/**'
      - 'tests/m16-*.mjs'
      - '.engineering/work-orders/GBS-WO-M16-001.md'
      - '.engineering/GBS-WO-M14-M18-ADMISSION.md'
      - 'planning/modules/area-d-gef-v1/m16-policy-guardrail-engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m16-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m16-policy-guardrail-engine.test.mjs tests/m16-exception-domain-hardening.test.mjs tests/m16-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
