name: M28 Test Impact Engine
on:
  pull_request:
    paths:
      - 'packages/test-impact-engine/**'
      - 'tests/m28-*.mjs'
      - '.engineering/work-orders/GBS-WO-M28-001.md'
      - '.engineering/GBS-WO-M28-ADMISSION.md'
      - 'planning/modules/area-g-evidence-and-review/m28-test-impact-engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m28-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m28-test-impact-engine.test.mjs tests/m28-hardening.test.mjs tests/m28-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
