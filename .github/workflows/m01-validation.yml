name: m01-validation

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "packages/contracts/**"
      - "packages/kernel/**"
      - "packages/cli/**"
      - "tests/m01.test.mjs"
      - ".github/workflows/m01-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, build and focused M01 tests
        run: npm run validate
