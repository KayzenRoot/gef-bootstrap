name: m01-validation

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "packages/contracts/**"
      - "packages/kernel/**"
      - "packages/cli/**"
      - "tests/*.test.mjs"
      - ".github/workflows/m01-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, build and focused M01 tests
        run: npm run validate
