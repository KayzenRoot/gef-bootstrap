name: WO-005 Execution Capsule Assurance

on:
  pull_request:
    paths:
      - "packages/execution-pack-compiler/**"
      - "packages/task-context-compiler/**"
      - ".engineering/evidence/GBS-V11-WO-005-EVIDENCE.md"
      - ".engineering/schemas/execution-capsule.schema.json"
      - "tests/v11-wo-005-*.test.mjs"
      - "tests/m14-*.test.mjs"
      - "tests/m15-*.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/wo-005-execution-capsule.yml"
  push:
    branches: [release/1.1]
    paths:
      - "packages/execution-pack-compiler/**"
      - "packages/task-context-compiler/**"
      - "tests/v11-wo-005-*.test.mjs"
      - ".github/workflows/wo-005-execution-capsule.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wo-005-execution-capsule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution-capsule:
    name: CTX-DET on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      WO_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact event head on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:WO_EXPECTED_SHA) { throw "Checkout head $actual does not match event head $env:WO_EXPECTED_SHA" }

      - name: Assert exact event head on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$WO_EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build -- --force

      - name: Typecheck
        run: npm run typecheck

      - name: CTX-DET and M14/M15 integration assurance
        run: node --test tests/v11-wo-005-execution-capsule.test.mjs tests/m14-task-context-compiler.test.mjs tests/m15-execution-pack-compiler.test.mjs tests/m15-startup-purity.test.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high
