name: M24 Evidence Engine
on:
  pull_request:
    paths:
      - 'packages/evidence-engine/**'
      - 'tests/m24-*.mjs'
      - '.engineering/work-orders/GBS-WO-M24-001.md'
      - '.engineering/GBS-WO-M24-ADMISSION.md'
      - 'planning/modules/area-g-evidence-and-review/m24-evidence-engine/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/m24-platform.yml'
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: node --test tests/m24-evidence-engine.test.mjs tests/m24-startup-purity.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
