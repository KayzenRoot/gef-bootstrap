name: V1.1.2 post-publish recovery verification

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful V1.1 trusted npm publication run ID whose post-publish verification needs recovery.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v11-wo012-post-publish-recovery-${{ inputs.release_run_id }}
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.ref == 'refs/heads/main'
    name: Read-only V1.1.2 registry and release verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      REGISTRY: https://registry.npmjs.org/
      PACKAGE: '@gef-bootstrap/cli@1.1.2'
    steps:
      - name: Check out the immutable v1.1.2 tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v1.1.2
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact release run and immutable tag source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          source_commit="$(git rev-parse 'v1.1.2^{commit}')"
          test "$(git rev-parse HEAD)" = "$source_commit"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main
          test "$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const p=JSON.parse(readFileSync('packages/cli/package.json','utf8')); if(p.name!=='@gef-bootstrap/cli'||p.version!=='1.1.2'||p.private!==false||p.repository?.url!=='https://github.com/KayzenRoot/gef-bootstrap.git') process.exit(1); process.stdout.write(p.version)")" = "1.1.2"
          gh run view "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json event,headSha,workflowName,conclusion > "$RUNNER_TEMP/release-run.json"
          node --input-type=module - "$RUNNER_TEMP/release-run.json" "$source_commit" <<'NODE'
          import { readFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (run.event !== 'push' || run.headSha !== process.argv[3] || run.workflowName !== 'V1.1 trusted npm publication' || run.conclusion !== 'success') throw new Error('Recovery input is not a successful exact-tag publication workflow run');
          NODE
          echo "Verified v1.1.2 tag source: $source_commit"

      - name: Set up Node.js and npm registry client
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin the release verification npm client
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Download the exact tarball and receipt from the publication run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "gef-v1.1.2-release-package-$RELEASE_RUN_ID" --dir "$RUNNER_TEMP/gef-v1.1.2-package-receipt"

      - name: Verify receipt, package identity, SHA-256 and npm SHA-512 SRI
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/gef-v1.1.2-package-receipt/GBS-V11-WO-012-RELEASE-MANIFEST.json"
          tarball="$RUNNER_TEMP/gef-v1.1.2-package-receipt/gef-bootstrap-cli-1.1.2.tgz"
          test -s "$receipt"
          test -s "$tarball"
          node --input-type=module - "$receipt" "$tarball" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const [receiptPath, archive] = process.argv.slice(2);
          const receipt = JSON.parse(readFileSync(receiptPath, 'utf8'));
          const bytes = readFileSync(archive);
          const source = execFileSync('git', ['rev-parse', 'v1.1.2^{commit}'], { encoding: 'utf8' }).trim();
          const pkg = JSON.parse(execFileSync('tar', ['-xOzf', archive, 'package/package.json'], { encoding: 'utf8' }));
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          if (receipt.workOrder !== 'GBS-V11-WO-012' || receipt.event !== 'push' || receipt.ref !== 'refs/tags/v1.1.2' || receipt.tag !== 'v1.1.2' || receipt.sourceCommit !== source || receipt.sourceCommit !== process.env.GITHUB_SHA || receipt.packageName !== '@gef-bootstrap/cli' || receipt.version !== '1.1.2' || receipt.private !== false || receipt.repository !== 'https://github.com/KayzenRoot/gef-bootstrap.git' || receipt.tarball.sha256 !== sha256) throw new Error('Release receipt does not bind to the immutable v1.1.2 tag and tarball');
          if (pkg.name !== '@gef-bootstrap/cli' || pkg.version !== '1.1.2' || pkg.private !== false || pkg.repository?.url !== 'https://github.com/KayzenRoot/gef-bootstrap.git') throw new Error('Tarball package identity mismatch');
          console.log(`Tarball SHA-256: ${sha256}`);
          console.log(`Rebuilt SHA-512 SRI: ${integrity}`);
          NODE
          expected_integrity="$(node --input-type=module - "$tarball" <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          process.stdout.write(`sha512-${createHash('sha512').update(readFileSync(process.argv[2])).digest('base64')}`);
          NODE
          )"
          registry_integrity="$(npm view "$PACKAGE" dist.integrity --registry="$REGISTRY")"
          test "$registry_integrity" = "$expected_integrity"
          test "$(npm view "$PACKAGE" version --registry="$REGISTRY")" = "1.1.2"
          test "$(npm view "$PACKAGE" repository.url --registry="$REGISTRY")" = "git+https://github.com/KayzenRoot/gef-bootstrap.git"
          echo "Registry dist.integrity exactly matches the immutable release tarball."

      - name: Verify npm registry signature and record attestation metadata
        shell: bash
        run: |
          set -euo pipefail
          npm view "$PACKAGE" dist.signatures --json --registry="$REGISTRY" > "$RUNNER_TEMP/npm-v1.1.2-signatures.json"
          npm view "$PACKAGE" dist.attestations --json --registry="$REGISTRY" > "$RUNNER_TEMP/npm-v1.1.2-attestations.json"
          integrity="$(npm view "$PACKAGE" dist.integrity --registry="$REGISTRY")"
          node --input-type=module - "$RUNNER_TEMP/npm-v1.1.2-signatures.json" "$RUNNER_TEMP/npm-v1.1.2-attestations.json" "$integrity" <<'NODE'
          import { createPublicKey, verify } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const [signaturePath, attestationPath, integrity] = process.argv.slice(2);
          const signatures = JSON.parse(readFileSync(signaturePath, 'utf8') || '[]');
          const attestationsText = readFileSync(attestationPath, 'utf8').trim();
          const attestations = attestationsText.length === 0 ? null : JSON.parse(attestationsText);
          if (!Array.isArray(signatures) || signatures.length === 0) throw new Error('The published package has no registry signatures');
          const keyResponse = await fetch('https://registry.npmjs.org/-/npm/v1/keys');
          if (!keyResponse.ok) throw new Error(`Unable to retrieve registry signing keys: HTTP ${keyResponse.status}`);
          const { keys } = await keyResponse.json();
          const message = Buffer.from(`@gef-bootstrap/cli@1.1.2:${integrity}`);
          let verified = false;
          for (const signature of signatures) {
            const key = keys.find((candidate) => candidate.keyid === signature.keyid && candidate.keytype === 'ecdsa-sha2-nistp256' && candidate.scheme === 'ecdsa-sha2-nistp256' && (!candidate.expires || Date.parse(candidate.expires) > Date.now()));
            if (!key) continue;
            const publicKey = createPublicKey({ key: Buffer.from(key.key, 'base64'), format: 'der', type: 'spki' });
            if (verify('sha256', message, publicKey, Buffer.from(signature.sig, 'base64'))) { verified = true; break; }
          }
          if (!verified) throw new Error('No npm registry signature verifies against a current registry key');
          console.log('npm registry signature: VERIFIED');
          console.log(`dist.attestations metadata: ${attestations === null ? 'ABSENT' : 'PRESENT (read-only metadata)'}`);
          NODE

      - name: Install the exact registry package and smoke the CLI and library
        shell: bash
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/gef-v1.1.2-registry-consumer"
          mkdir -p "$consumer"
          (
            cd "$consumer"
            npm init -y
            npm install --ignore-scripts --no-audit --no-fund "$PACKAGE" --registry="$REGISTRY"
          )
          node --input-type=module - "$consumer/node_modules" <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const modules = process.argv[2];
          const nativeRuntime = process.platform === 'linux' && process.arch === 'x64' ? '@koromix/koffi-linux-x64' : process.platform === 'darwin' && process.arch === 'arm64' ? '@koromix/koffi-darwin-arm64' : process.platform === 'darwin' && process.arch === 'x64' ? '@koromix/koffi-darwin-x64' : process.platform === 'win32' && process.arch === 'x64' ? '@koromix/koffi-win32-x64' : null;
          if (nativeRuntime === null) throw new Error(`Unsupported recovery runner: ${process.platform}-${process.arch}`);
          const required = ['@gef-bootstrap/cli', '@gef-bootstrap/config', '@gef-bootstrap/contracts', '@gef-bootstrap/kernel', '@gef-bootstrap/preflight', '@gef-bootstrap/project-identity', nativeRuntime, 'koffi'];
          for (const name of required) if (!existsSync(join(modules, name, 'package.json'))) throw new Error(`Physical bundled runtime package is missing: ${name}`);
          const manifest = JSON.parse(readFileSync(join(modules, '@gef-bootstrap/cli/package.json'), 'utf8'));
          if (manifest.version !== '1.1.2') throw new Error('Installed registry package version mismatch');
          console.log(`Physical bundled runtime packages verified: ${required.length}`);
          NODE
          bin="$consumer/node_modules/.bin/gef"
          "$bin" --version | grep -F '"version": "1.1.2"'
          "$bin" --help > /dev/null
          node --input-type=module -e "import { processExitCodeFor } from '@gef-bootstrap/cli'; if (typeof processExitCodeFor !== 'function') process.exit(1)" -- "$consumer"
          "$bin" doctor --target "$consumer" --json > "$RUNNER_TEMP/v1.1.2-doctor.json"
          "$bin" status --target "$consumer" --json > "$RUNNER_TEMP/v1.1.2-status.json"
          node --input-type=module - "$RUNNER_TEMP/v1.1.2-doctor.json" "$RUNNER_TEMP/v1.1.2-status.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const file of process.argv.slice(2)) {
            const result = JSON.parse(readFileSync(file, 'utf8'));
            if (result.ok !== true) throw new Error(`Registry CLI smoke returned a non-success envelope: ${file}`);
          }
          NODE
          echo "Recovery verification completed without changing npm or the immutable v1.1.2 tag."
