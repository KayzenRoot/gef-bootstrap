name: M41-M47 Integrated Assurance

permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'packages/m41-m47-platform/**'
      - 'tests/m41-m47-platform.test.mjs'
      - 'planning/modules/area-j-integrations/m4[12]-*/**'
      - 'planning/modules/area-k-observability/**'
      - 'planning/modules/area-l-artifacts-and-ux/m4[67]-*/**'
      - '.engineering/**'
      - '.github/workflows/m41-m47-integrated.yml'
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --test tests/m41-m47-platform.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
