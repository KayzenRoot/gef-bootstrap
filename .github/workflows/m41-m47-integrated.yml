name: M41-M47 Integrated Assurance

permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'packages/m41-m47-platform/**'
      - 'tests/m41-m47-platform.test.mjs'
      - 'planning/modules/area-j-integrations/m4[12]-*/**'
      - 'planning/modules/area-k-observability/**'
      - 'planning/modules/area-l-artifacts-and-ux/m4[67]-*/**'
      - '.engineering/**'
      - '.github/workflows/m41-m47-integrated.yml'
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --test tests/m41-m47-platform.test.mjs
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
