name: m08-platform

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/project-profiles/**"
      - "tests/m08-*.mjs"
      - ".github/workflows/m08-platform.yml"
      - "package.json"
      - "package-lock.json"
jobs:
  project-profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: node --test tests/m08-project-profiles.test.mjs tests/m08-startup-purity.test.mjs
