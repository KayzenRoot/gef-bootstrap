name: m08-platform
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/project-profiles/**"
      - "tests/m08-*.mjs"
      - ".github/workflows/m08-platform.yml"
      - "package.json"
      - "package-lock.json"
jobs:
  project-profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: node --test tests/m08-project-profiles.test.mjs tests/m08-startup-purity.test.mjs
